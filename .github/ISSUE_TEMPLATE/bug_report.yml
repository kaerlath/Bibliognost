name: Bug report
description: Report a reproducible Bibliognost problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include connect.sid values, API keys, downloaded mods, or unsanitized logs."
  - type: input
    id: version
    attributes:
      label: Bibliognost version
      placeholder: 0.23.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Not provider-specific, XIV Mod Archive, Heliosphere, Nexus Mods]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you clicked and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sanitized screenshots or logs
      description: Remove account names, paths, session values, and API keys first.

