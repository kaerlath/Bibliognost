name: Publish tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release files
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath latest.zip)) { throw "latest.zip is missing." }
          if (-not (Test-Path -LiteralPath repo.json)) { throw "repo.json is missing." }
          Get-Content -Raw repo.json | ConvertFrom-Json | Out-Null
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256=$(sha256sum latest.zip | cut -d ' ' -f 1)
          gh release create "${GITHUB_REF_NAME}" latest.zip \
            --title "Bibliognost ${GITHUB_REF_NAME#v}" \
            --notes "Private testing build. SHA-256: \`${SHA256}\`\n\nSee CHANGELOG.md for details."

